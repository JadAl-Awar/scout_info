<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>My QR Phone Site</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      color-scheme: light dark;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      padding: 16px;
      min-height: 100vh;
    }
    .page {
      width: 100%;
      max-width: 420px; /* looks nice on phones */
      background: rgba(15, 23, 42, 0.96);
      border-radius: 20px;
      padding: 20px 18px 24px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(148, 163, 184, 0.4);
    }
    h1 {
      font-size: 1.6rem;
      margin: 0 0 0.25rem;
    }
    .tagline {
      font-size: 0.9rem;
      color: #cbd5f5;
      opacity: 0.9;
      margin-bottom: 1rem;
    }
    h2 {
      font-size: 1.1rem;
      margin: 1.2rem 0 0.4rem;
    }
    p {
      margin: 0.3rem 0;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .photos {
      margin-top: 0.6rem;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .photo-card {
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.5);
      background: rgba(15, 23, 42, 0.9);
    }
    .photo-card img {
      display: block;
      width: 100%;
      height: auto;
    }
    .photo-caption {
      padding: 8px 10px 10px;
      font-size: 0.85rem;
      color: #d1d5db;
    }
    .footer {
      margin-top: 1.4rem;
      font-size: 0.75rem;
      opacity: 0.7;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>My QR Website</h1>
    <p class="tagline">Scan the QR code to open this page on your phone.</p>

    <h2>About</h2>
    <p>
      This is a demo page designed for phones. Replace this text with your own
      description, info, menu, business details, or anything you like.
    </p>

    <h2>Photos</h2>
    <div class="photos">
      <div class="photo-card">
        <img src="images/real madrid.jpg" alt="Photo 1">
        <div class="photo-caption">Caption for photo 1.</div>
      </div>

      <div class="photo-card">
        <img src="images/photo2.jpg" alt="Photo 2">
        <div class="photo-caption">Caption for photo 2.</div>
      </div>
    </div>

    <div class="footer">
      © 2025 My QR Site
    </div>
  </div>
</body>
</html>
